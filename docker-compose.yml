# Local stack: PostgreSQL + the API.  Run:  docker compose up --build
# Then open http://localhost:8000 and click "Run sync now".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records   # local demo only; use a secret store in real deployments
      POSTGRES_DB: records
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U records"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://records:records@db:5432/records
      OAI_BASE_URL: ${OAI_BASE_URL:-mock}
      OAI_SET: ${OAI_SET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
