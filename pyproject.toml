[project]
name = "library-records-sync"
version = "1.0.0"
description = "Harvests library repository records over OAI-PMH, keeps them in sync in a database, and serves them through a REST API and an accessible search page."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the normal pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
# third-party deprecation inside starlette's TestClient, not our code
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
