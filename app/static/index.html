<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Records Sync</title>
  <style>
    :root { --text: #1b1b1b; --muted: #4a4a4a; --bg: #ffffff; --line: #c9c9c9; --accent: #13294b; --accent-text: #ffffff; --focus: #e84a27; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f1f1f1; --muted: #c4c4c4; --bg: #121212; --line: #444; --accent: #9fc3ff; --accent-text: #0b1a33; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip { position: absolute; left: -999px; top: 0; padding: .5rem 1rem; background: var(--accent); color: var(--accent-text); }
    .skip:focus { left: 0; }
    header, main { max-width: 960px; margin: 0 auto; padding: 1rem; }
    h1 { margin: .5rem 0 0; font-size: 1.6rem; }
    header p { margin: .25rem 0 0; color: var(--muted); }
    form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: 1rem 0; }
    .field { display: flex; flex-direction: column; gap: .25rem; }
    label { font-weight: 600; }
    input, select, button { font: inherit; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
    input[type="search"] { min-width: 18rem; }
    button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
    button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    #status { min-height: 1.5rem; color: var(--muted); }
    ol.results { list-style: none; padding: 0; margin: 0; }
    ol.results li { border-top: 1px solid var(--line); padding: .75rem 0; }
    ol.results h3 { margin: 0; font-size: 1.1rem; }
    ol.results a { color: inherit; }
    .meta { color: var(--muted); font-size: .95rem; }
    .pager { display: flex; gap: .5rem; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    caption { text-align: left; font-weight: 600; padding-bottom: .25rem; }
    th, td { border-bottom: 1px solid var(--line); padding: .4rem .5rem; text-align: left; }
    section { margin-top: 2rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to search</a>
  <header>
    <h1>Library Records Sync</h1>
    <p>Search records harvested from the repository over OAI-PMH.</p>
  </header>

  <main id="main">
    <form id="search-form" role="search" aria-label="Search records">
      <div class="field">
        <label for="q">Search title, creator or subject</label>
        <input id="q" name="q" type="search" autocomplete="off">
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="">All types</option>
          <option>Dataset</option>
          <option>Image</option>
          <option>Sound</option>
          <option>Text</option>
          <option>Thesis</option>
        </select>
      </div>
      <button type="submit">Search</button>
    </form>

    <h2 id="results-heading" class="sr-only">Search results</h2>
    <p id="status" role="status" aria-live="polite"></p>
    <ol id="results" class="results" aria-labelledby="results-heading"></ol>
    <nav class="pager" aria-label="Result pages">
      <button type="button" class="secondary" id="prev">Previous page</button>
      <button type="button" class="secondary" id="next">Next page</button>
    </nav>

    <section aria-labelledby="sync-heading">
      <h2 id="sync-heading">Sync</h2>
      <button type="button" id="run-sync">Run sync now</button>
      <p id="sync-status" role="status" aria-live="polite"></p>
      <table>
        <caption>Recent sync runs</caption>
        <thead>
          <tr><th scope="col">Run</th><th scope="col">Status</th><th scope="col">Inserted</th><th scope="col">Updated</th>
              <th scope="col">Unchanged</th><th scope="col">Deleted</th><th scope="col">Failed</th><th scope="col">Started</th></tr>
        </thead>
        <tbody id="runs"></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { page: 1, pageSize: 10, total: 0 };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function search() {
      const params = new URLSearchParams({ page: state.page, page_size: state.pageSize });
      const q = $("q").value.trim();
      const type = $("type").value;
      if (q) params.set("q", q);
      if (type) params.set("type", type);
      $("status").textContent = "Searching…";
      try {
        const res = await fetch(`/api/records?${params}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.total = data.total;
        $("results").innerHTML = data.items.map((r) => `
          <li>
            <h3>${r.link ? `<a href="${esc(r.link)}">${esc(r.title)}</a>` : esc(r.title)}</h3>
            <div class="meta">${esc(r.creators.join("; ") || "No creator listed")} · ${esc(r.date || "n.d.")} · ${esc(r.resource_type || "")}</div>
            ${r.description ? `<p>${esc(r.description)}</p>` : ""}
          </li>`).join("");
        const pages = Math.max(1, Math.ceil(data.total / state.pageSize));
        $("status").textContent = data.total === 0
          ? "No records found."
          : `${data.total} record${data.total === 1 ? "" : "s"} found. Page ${state.page} of ${pages}.`;
        $("prev").disabled = state.page <= 1;
        $("next").disabled = state.page >= pages;
      } catch (err) {
        $("status").textContent = `Search failed (${err.message}). Please try again.`;
      }
    }

    async function loadRuns() {
      const res = await fetch("/api/sync-runs?take=5");
      if (!res.ok) return;
      const runs = await res.json();
      $("runs").innerHTML = runs.map((r) => `
        <tr><td>${r.id}</td><td>${esc(r.status)}</td><td>${r.inserted}</td><td>${r.updated}</td>
            <td>${r.unchanged}</td><td>${r.deleted}</td><td>${r.failed}</td>
            <td>${esc(new Date(r.started_at).toLocaleString())}</td></tr>`).join("");
    }

    $("search-form").addEventListener("submit", (e) => { e.preventDefault(); state.page = 1; search(); });
    $("prev").addEventListener("click", () => { state.page -= 1; search(); });
    $("next").addEventListener("click", () => { state.page += 1; search(); });
    $("run-sync").addEventListener("click", async () => {
      $("run-sync").disabled = true;
      $("sync-status").textContent = "Sync running…";
      try {
        const res = await fetch("/api/sync", { method: "POST" });
        const body = await res.json();
        $("sync-status").textContent = res.ok
          ? `Run ${body.id} ${body.status}: ${body.inserted} inserted, ${body.updated} updated, ${body.deleted} deleted, ${body.failed} failed.`
          : (body.detail || `Sync failed (HTTP ${res.status}).`);
        await Promise.all([loadRuns(), search()]);
      } catch (err) {
        $("sync-status").textContent = `Sync failed (${err.message}).`;
      } finally {
        $("run-sync").disabled = false;
      }
    });

    search();
    loadRuns();
  </script>
</body>
</html>
